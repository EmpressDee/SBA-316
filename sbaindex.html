<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Team Builder</title>

    <link rel="stylesheet" href="styless.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="scriptSba.js" defer></script>
  </head>
  <body>
    <h1>Pokemon Team Builder</h1>

    <!-- adding a parent container to help reorganize page layout -->

    <div class="mainContainer">
      <div class="panel">
        <h2>Pokemon Database</h2>

        <!-- Adding a search option Req: validation,input-->

        <input type="text" id="searchPokemon" placeholder="Search Pokemon" />

        <div id="pokeList"></div>
      </div>

      <div class="panel">
        <h2>Pokemon Info</h2>

        <div id="pokemonCards">
          <h3>Select a Pokemon</h3>
        </div>
      </div>

      <div class="panel">
        <h2>My Team</h2>

        <div id="teamContainer"></div>
      </div>
    </div>

    <!-- creating a container for my pokemon info cards. Then create the elements in js -->
    <div id="pokemonContainer"></div>

    <div id="pokemonDatabase"></div>

    <hr />

    <div class="pokeball-icon"></div>
  </body>
</html>
